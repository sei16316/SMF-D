<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="index-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <title>SMF-D</title>
    <style>
        /* =========================
   Base
========================= */
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #fff;
        }

        /* =========================
   Title
========================= */
        .contact-ttl {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            color: #00a5a0;
        }

        /* =========================
   Table (Form Card)
========================= */
        .contact-table {
            width: 100%;
            margin-bottom: 30px;
            border-collapse: separate;
            border-spacing: 0;
            background-color: #e6f5f4;
            border-radius: 10px;
            overflow: hidden;
        }

        /* 左：項目名 */
        .contact-item {
            width: 30%;
            padding: 20px;
            background-color: #00a5a0;
            color: #fff;
            font-weight: 600;
            border: 1px solid #4fb7b3;
            vertical-align: middle;
        }

        /* 右：入力欄 */
        .contact-body {
            width: 70%;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #4fb7b3;
        }

        /* =========================
   Form Parts
========================= */
        .form-text,
        .form-textarea,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #4fb7b3;
            font-size: 15px;
            transition: 0.2s;
            background-color: #fff;
        }

        .form-textarea {
            height: 200px;
            resize: vertical;
        }

        .form-text:focus,
        .form-textarea:focus,
        select:focus {
            outline: none;
            border-color: #00a5a0;
            box-shadow: 0 0 0 3px rgba(0, 165, 160, 0.2);
        }

        /* =========================
   Submit Button
========================= */
        .contact-submit {
            width: 260px;
            background-color: #00a5a0;
            color: #fff;
            font-weight: 700;
            display: block;
            margin: 30px auto 10px;
            font-size: 17px;
            padding: 16px;
            border-radius: 100vh;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-submit:hover {
            background-color: #008f8a;
            transform: translateY(-2px);
        }
    </style>
</head>

<header>
    <nav class="navbar navbar-expand-lg ">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Spring Music Festival 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link C" href="timetable.html">タイムテーブル</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="artists/index.html">出演者一覧</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="ticket.html">チケット情報</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="goods.html">グッズ紹介</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="guide.html">来場者ガイド</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<body>
    <div class="container" id="A">
        <h1 class="contact-ttl">お問い合わせ内容</h1>
        <form action="">
            <table class="contact-table">
                <tr>
                    <th class="contact-item">お問い合わせ種類</th>
                    <td class="contact-body">
                        <select name="toiawase">
                            <option value="">お問い合わせ内容の種類を選んでください</option>
                            <option>チケットについて</option>
                            <option>会場について</option>
                            <option>出演者について</option>
                            <option>その他</option>
                        </select>

                    </td>
                </tr>
                <tr>
                    <th class="contact-item">名前</th>
                    <td class="contact-body">
                        <input type="text" name="名前" class="form-text">
                    </td>
                </tr>
                <tr>
                    <th class="contact-item">メールアドレス</th>
                    <td class="contact-body">
                        <input type="email" name="メール" class="form-text">
                    </td>
                </tr>
                <tr>
                    <th class="contact-item">電話番号</th>
                    <td class="contact-body">
                        <input type="tel" name="電話" class="form-text">
                    </td>
                </tr>
                <tr>
                    <th class="contact-item">お問い合わせ内容</th>
                    <td class="contact-body">
                        <textarea name="問い合わせ" class="form-textarea"></textarea>
                    </td>
                </tr>
            </table>
            <button type="button" class="contact-submit" onclick="location.href='./contact-confirm.html'">確認画面へ</button>
        </form>
    </div>

    <footer>
        <nav>
            <ul>
                <li><a href="faq.html">よくある質問</a></li>
                <li><a href="access.html">会場案内</a></li>
                <li><a href="contact.html">お問い合わせフォーム</a></li>
                <li><a href="privacy.html">プライバシーポリシー</a></li>
            </ul>
        </nav>
    </footer>
</body>
