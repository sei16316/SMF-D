    <link rel="stylesheet" href="index-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">
    <title>SMF-D</title>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #F9FBFA;
            color: #333;
        }

        /* タイトル */
        .contact-ttl {
            font-size: 40px;
            font-weight: 700;
            margin: 80px 0 40px;
            text-align: center;
            color: #00a5a0;
        }

        /* テーブル */
        .contact-table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 40px;
            border-collapse: collapse;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* 共通セル */
        .contact-item,
        .contact-body {
            padding: 18px 22px;
            border-bottom: 1px solid #00a5a0;
            font-size: 16px;
        }

        /* 左カラム */
        .contact-item {
            width: 30%;
            background-color: #00a5a0;
            font-weight: 500;
            color: #fff;
        }

        /* 右カラム */
        .contact-body {
            width: 70%;
            background-color: #fff;
        }

        /* ボタン */
        .contact-submit {
            width: 260px;
            background: linear-gradient(135deg,#00a5a0);
            color: #fff;
            font-weight: 600;
            display: block;
            margin: 0 auto 15px;
            font-size: 16px;
            padding: 15px;
            border-radius: 100vh;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
            transition: all 0.25s ease;
        }

        .contact-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(46, 125, 50, 0.4);
        }

        /* 戻るボタンだけ少し控えめにしたい場合 */
        .contact-submit:last-of-type {
            background: #eee;
            color: #333;
            box-shadow: none;
        }
    </style>
</head>
