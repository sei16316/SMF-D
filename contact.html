<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="index-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <title>SMF-D</title>
    <style>
        .contact-ttl {
            font-size: 40;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .contact-table {
            width: 100%;
            margin-bottom: 20px;
        }

        .contact-item,
        .contact-body {
            padding: 20px;
            border: 1px solid #ccc;
        }

        .contact-item {
            text-align: left;
            width: 30%;
            background-color: #eee;
        }

        .contact-body {
            width: 70%;
        }

        .form-text{
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border-radius: 1px solid #ccc;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            max-width: 400px;
        }

        .form-textarea{
            width: 100%;
            padding: 10px;
            height: 200px;
            border-radius: 5px;
            border: 1px solid #ccc;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .contact-submit {
            width: 250px;
            background-color: #333;
            color: #fff;
            font-weight: bold;
            display: block;
            margin: 0 auto;
            margin-bottom: 10px;
            font-size: 16px;
            padding: 15px;
            border-radius: 100vh;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<header>
    <nav class="navbar navbar-expand-lg ">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Spring Music Festival 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link C" href="#">タイムテーブル</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="#">出演者一覧</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="#">チケット情報</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="#">グッズ紹介</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link C" href="#">来場者ガイド</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<body>
    <div class="container" id="A">
        <h1 class="contact-ttl">お問い合わせ内容</h1>
        <form action="">
            <table class="contact-table">
                <tr>
                    <th class="contact-item">お問い合わせ種類</th>
                    <td class="contact-body">
                        <select name="toiawase">
                            <option value="">お問い合わせ内容の種類を選んでください</option>
                            <option>チケットについて</option>
                            <option>会場について</option>
                            <option>出演者について</option>
                            <option>その他</option>
                        </select>

                    </td>
                </tr>
                <tr>
                    <th class="contact-item">名前</th>
                    <td class="contact-body">
                        <input type="text" name="名前" class="form-text">
                    </td>
                </tr>
                <tr>
                    <th class="contact-item">メールアドレス</th>
                    <td class="contact-body">
                        <input type="email" name="メール" class="form-text">
                    </td>
                </tr>
                <tr>
                    <th class="contact-item">電話番号</th>
                    <td class="contact-body">
                        <input type="tel" name="電話" class="form-text">
                    </td>
                </tr>
                <tr>
                    <th class="contact-item">お問い合わせ内容</th>
                    <td class="contact-body">
                        <textarea name="問い合わせ" class="form-textarea"></textarea>
                    </td>
                </tr>
            </table>
            <button type="button" class="contact-submit" onclick="location.href='./contact-confirm.html'">確認画面へ</button>
        </form>
    </div>

    <footer>
        <nav>
            <ul>
                <li><a href="faq.html">よくある質問</a></li>
                <li><a href="#">会場案内</a></li>
                <li><a href="contact-confirm.html">お問い合わせフォーム</a></li>
                <li><a href="#">プライバシーポリシー</a></li>
            </ul>
        </nav>
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>

</html>
